name: Ship Wave

# Temporary (2026-10-24). SwiftAkira/wave's own Actions are held up by
# billing, so this public repository builds it on the free runners GitHub
# gives public repositories. It compares wave's main with what the download
# page was last built from (files/source.txt on wave's gh-pages branch) and
# builds when main moved, unless only docs changed. The apps go to this
# repository's releases. The download page and its manifest point at them
# and go to wave's gh-pages branch, which GitHub Pages serves at
# https://usewave.stream/.
#
# What starts it: a push of request.txt here (whoever ships writes the wave
# commit to build into it), a change to this file, Run workflow, and every
# 15 minutes. GitHub never started that schedule on this repository (not one
# scheduled run from 01:44 to 04:30 UTC on 2026-10-24), so a release can't
# wait for it.
#
# Only this file is public: the code stays in the private repository, and no
# step prints a key. Secrets: WAVE_SOURCE_TOKEN (a fine-grained token with
# Contents read and write on SwiftAkira/wave only) and WAVE_ANDROID_KEYSTORE
# (the family signing key, base64). Every action is pinned to a commit (its
# tag beside it): this repository is public, and its jobs hold the signing
# key and a token that writes to wave, so a moved tag must not reach them.
on:
  # A build asked for in request.txt, or a change to this workflow, runs it
  # at once.
  push:
    branches: [main]
    paths: ['request.txt', '.github/workflows/ship.yml']
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the download page is up to date
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

# One build at a time; a check that comes in meanwhile waits for it.
concurrency:
  group: ship

env:
  SOURCE: SwiftAkira/wave
  FLUTTER_VERSION: 3.47.7
  PYTHON_VERSION: 3.11.9
  # Provider host dependencies, pinned like the Android build's.
  HOST_PACKAGES: requests==2.32.5 certifi==2026.7.22 guessit==4.4.0
  # Standalone CPython for Apple Silicon (astral-sh/python-build-standalone).
  MAC_PYTHON_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.11.16%2B20260924-aarch64-apple-darwin-install_only.tar.gz
  MAC_PYTHON_SHA256: d718e3c5c6f4b225ed25f88bf65e4c5d314e0dea0d716ea50bc9d038630c502b

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.look.outputs.sha }}
      build: ${{ steps.look.outputs.build }}
    steps:
      - id: look
        env:
          TOKEN: ${{ secrets.WAVE_SOURCE_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          # Quiet until the secret is there, so the schedule sends no failures.
          if [ -z "$TOKEN" ]; then
            echo "::notice::Waiting for the WAVE_SOURCE_TOKEN secret (see the README)."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api() {
            curl -fsS -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Accept: ${2:-application/vnd.github+json}" "https://api.github.com/repos/$SOURCE/$1"
          }
          sha=$(api commits/main | jq -r .sha)
          built=$( (api 'contents/files/source.txt?ref=gh-pages' application/vnd.github.raw 2>/dev/null || true) | tr -d '[:space:]')
          build=true
          if [ "$FORCE" != true ] && [ -n "$built" ]; then
            if [ "$built" = "$sha" ]; then
              build=false
            else
              changed=$(api "compare/$built...$sha" | jq -r '.files[].filename' || echo '?')
              # Docs alone (as wave's own workflow skips them) wait for the next change.
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '\.md$|^artifacts/mocks/'; then
                build=false
              fi
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "main is at ${sha:0:12}, the download page was built from ${built:0:12}: build=$build"

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.WAVE_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The real update script on Windows (swap, copy-over, reopen): a
      # broken updater strands every Windows PC on its version.
      - name: Updater works on Windows
        timeout-minutes: 15
        run: flutter test test/updates/desktop_update_windows_test.dart
      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release --dart-define-from-file=artifacts/private/build-config.json
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed.' }
      - name: Package Python source search and runtime files
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build/windows/x64/runner/Release'
          $runtimeDir = Join-Path $releaseDir 'python'
          $archivePath = Join-Path $env:RUNNER_TEMP 'wave-python-embed.zip'
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $runtimeDir
          @('python311.zip', '.', 'Lib/site-packages', 'import site') | Set-Content -LiteralPath (Join-Path $runtimeDir 'python311._pth')
          python -m pip install --quiet --disable-pip-version-check --target (Join-Path $runtimeDir 'Lib/site-packages') $env:HOST_PACKAGES.Split(' ')
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python dependencies could not be installed.' }
          Copy-Item -LiteralPath 'python/wave_host.py' -Destination (Join-Path $runtimeDir 'wave_host.py')
          & (Join-Path $runtimeDir 'python.exe') (Join-Path $runtimeDir 'wave_host.py') status (Join-Path $env:RUNNER_TEMP 'wave-provider-package-test') | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python provider host failed its status check.' }
          # The Visual C++ runtime travels with the app, so a fresh Windows
          # 10 or 11 PC needs nothing else installed.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -LiteralPath (Join-Path $env:WINDIR "System32/$dll") -Destination $releaseDir
          }
          @(
            'Wave for Windows 10 and 11',
            '',
            '1. Keep this whole folder together (for example in Documents\Wave).',
            '2. Open wave.exe.',
            '3. If Windows says it protected your PC: More info, then Run anyway.',
            '   Wave is shared privately, so it is not signed by Microsoft.',
            '',
            'That is all. From now on Wave updates itself.'
          ) | Set-Content -Encoding utf8 (Join-Path $releaseDir 'Read me.txt')
          $package = Join-Path $env:RUNNER_TEMP 'Wave'
          Move-Item -LiteralPath $releaseDir -Destination $package
          Compress-Archive -Path $package -DestinationPath 'Wave-Windows.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wave-Windows
          path: Wave-Windows.zip
          retention-days: 3
          if-no-files-found: error

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.WAVE_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define-from-file=artifacts/private/build-config.json
      - name: Package Python source search
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Wave.app"
          PY="$APP/Contents/Resources/python"
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" "$MAC_PYTHON_URL"
          echo "$MAC_PYTHON_SHA256  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/python/lib/python3.11/test" "$RUNNER_TEMP/python/lib/python3.11/idlelib" \
                 "$RUNNER_TEMP/python/lib/python3.11/tkinter" "$RUNNER_TEMP/python/lib/python3.11/turtledemo"
          mv "$RUNNER_TEMP/python" "$PY"
          "$PY/bin/python3" -m pip install --quiet --disable-pip-version-check --no-compile $HOST_PACKAGES
          cp python/wave_host.py "$PY/wave_host.py"
          # Nothing may be written into the app before it is signed; the app
          # points Python's cache at its data folder the same way.
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache" "$PY/bin/python3" "$PY/wave_host.py" status "$RUNNER_TEMP/wave-provider-package-test" > /dev/null
      - name: Sign for this Mac (ad hoc) and zip
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Wave.app"
          # Every binary inside the bundled Python, then the app around it.
          find "$APP/Contents/Resources/python" -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then codesign --force --sign - "$f"; fi
          done
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p package
          ditto "$APP" package/Wave.app
          printf '%s\n' \
            'Wave for Mac (Apple silicon)' \
            '' \
            '1. Drag Wave into Applications.' \
            '2. Open Terminal and run this once:' \
            '   xattr -dr com.apple.quarantine /Applications/Wave.app' \
            '3. Open Wave.' \
            '' \
            'Step 2 is needed because Wave is shared privately and is not' \
            'notarized by Apple; without it macOS says the app cannot be opened.' \
            '' \
            'That is all. From now on Wave updates itself.' \
            > "package/Start here.txt"
          ditto -c -k --sequesterRsrc package Wave-Mac.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wave-Mac
          path: Wave-Mac.zip
          retention-days: 3
          if-no-files-found: error

  android:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.WAVE_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      # Chaquopy builds the Python source search with the same Python.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The key every family APK is signed with, so these builds install
      # over the existing app.
      - name: Family signing key
        env:
          KEYSTORE: ${{ secrets.WAVE_ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the WAVE_ANDROID_KEYSTORE secret (see the README)."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/family.keystore"
          echo "WAVE_SIGNING_KEYSTORE=$RUNNER_TEMP/family.keystore" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=artifacts/private/build-config.json --target-platform=android-arm,android-arm64
      - name: Check the source search survived R8 and the signature matches
        run: |
          set -euo pipefail
          grep -q "void emit(java.lang.String)" build/app/outputs/mapping/release/mapping.txt
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SIGNER=$("$TOOLS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [ "$SIGNER" != "cd7a807af46a97774c11dd80bb3c743c0340e9ac1a23c63ed3a637b816049bdd" ]; then
            echo "::error::The APK is signed with $SIGNER, not the family key."
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk Wave-Android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wave-Android
          path: Wave-Android.apk
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [check, windows, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.WAVE_SOURCE_TOKEN }}
          persist-credentials: false
          path: wave
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: builds
      # No key may leave in an app or the site (2026-10-27): nothing is
      # published until this passes (wave's tool/scan_release.py).
      - name: No keys in the apps
        run: |
          python3 wave/tool/scan_release.py builds/Wave-Android/Wave-Android.apk \
            builds/Wave-Windows/Wave-Windows.zip builds/Wave-Mac/Wave-Mac.zip wave/site
      # The APK is over the 100 MB a file in a git branch may be, so the apps
      # live in this repository's releases and the manifest points there.
      - name: Put the apps in a release here
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' wave/pubspec.yaml)
          build=$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' wave/pubspec.yaml)
          tag="v$version-b$build-r$GITHUB_RUN_NUMBER"
          # The version's notes as viewers read them in What's new.
          node -e '
            const [first] = require("./wave/assets/release_notes.json");
            const lines = first.version === process.argv[1] ? first.notes.map((note) => `- ${note.text}`) : [];
            require("fs").writeFileSync(process.argv[2], [...lines, "", process.argv[3]].join("\n") + "\n");
          ' "$version" "$RUNNER_TEMP/notes.md" "Build $build, from ${SHA:0:12}."
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --latest \
            --title "Wave $version" --notes-file "$RUNNER_TEMP/notes.md" \
            builds/Wave-Android/Wave-Android.apk builds/Wave-Windows/Wave-Windows.zip builds/Wave-Mac/Wave-Mac.zip
          {
            echo "version=$version"
            echo "build=$build"
            echo "base=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Download page and manifest
        env:
          TOKEN: ${{ secrets.WAVE_SOURCE_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
          BASE: ${{ steps.release.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p _site/fonts _site/files
          cp -R wave/site/. _site/
          # The custom domain set in wave's Settings → Pages lives in the
          # CNAME file GitHub writes to gh-pages; every build keeps it.
          cname=$( (curl -fsS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$SOURCE/contents/CNAME?ref=gh-pages" 2>/dev/null || true) | tr -d '[:space:]')
          if [ -n "$cname" ]; then
            echo "$cname" > _site/CNAME
            echo "Custom domain: $cname"
          fi
          cp wave/assets/wave_mark.svg _site/
          cp wave/assets/fonts/inter/Inter-Regular.ttf wave/assets/fonts/inter/Inter-SemiBold.ttf \
             wave/assets/fonts/inter/Inter-Bold.ttf wave/assets/fonts/inter/InterDisplay-Bold.ttf _site/fonts/
          node - <<'EOF'
          const { createHash } = require('node:crypto');
          const { readFileSync, statSync, writeFileSync } = require('node:fs');
          const files = [
            ['mac', 'builds/Wave-Mac/Wave-Mac.zip'],
            ['windows', 'builds/Wave-Windows/Wave-Windows.zip'],
            ['android', 'builds/Wave-Android/Wave-Android.apk'],
          ].map(([id, path]) => {
            const name = path.split('/').pop();
            return {
              id,
              name,
              url: `${process.env.BASE}/${name}`,
              size: statSync(path).size,
              sha256: createHash('sha256').update(readFileSync(path)).digest('hex'),
            };
          });
          // kdf is an object so the apps (0.2.30 on) read this as the family
          // page's manifest; there are no encrypted pieces for 0.2.29 and
          // older here, which update once wave's own workflow runs again.
          const manifest = {
            version: process.env.VERSION,
            buildNumber: Number(process.env.BUILD),
            builtAt: new Date().toISOString(),
            kdf: {},
            files,
          };
          writeFileSync('_site/files/manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          for (const file of files) console.log(`${file.id}: ${file.name}, ${(file.size / 1048576).toFixed(1)} MiB`);
          EOF
          echo "$SHA" > _site/files/source.txt
          touch _site/.nojekyll
      - name: Publish on wave's gh-pages branch
        env:
          TOKEN: ${{ secrets.WAVE_SOURCE_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Wave $VERSION from ${SHA:0:12}"
          git push -qf "https://x-access-token:$TOKEN@github.com/$SOURCE.git" HEAD:gh-pages
      # Older releases go once five newer ones exist (a device that read the
      # manifest a moment before a new one still finds its file).
      - name: Keep the five newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
